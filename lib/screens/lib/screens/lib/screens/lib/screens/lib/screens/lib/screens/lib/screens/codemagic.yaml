workflows:
  safenum-build:
    name: SafeNum Build
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        # These map to Codemagic's own "Environment variables" dashboard —
        # NEVER put real key values here in the yaml file itself.
        BREACH_CHECK_API_KEY: $BREACH_CHECK_API_KEY
        LOOKUP_API_KEY: $LOOKUP_API_KEY
        SAFE_BROWSING_API_KEY: $SAFE_BROWSING_API_KEY
    scripts:
      - name: Create .env from Codemagic secrets
        script: |
          echo "BREACH_CHECK_API_KEY=$BREACH_CHECK_API_KEY" > .env
          echo "LOOKUP_API_KEY=$LOOKUP_API_KEY" >> .env
          echo "SAFE_BROWSING_API_KEY=$SAFE_BROWSING_API_KEY" >> .env
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate platform folders (android/ios) if missing
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi
      - name: Build APK (for direct install/testing)
        script: flutter build apk --release
      - name: Build AAB (for Play Store upload)
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/**/*.apk
      - build/app/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - your-vinitgodara453@gmail.com
